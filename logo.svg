<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dark Triad Flow logo</title>
  <desc id="desc">A compact white triangle logo for Dark Triad Flow with Calendar, Notes, Dark Triad, Flow, and Tasks on a black rounded square.</desc>
  <rect x="6" y="6" width="500" height="500" rx="28" fill="#020202" stroke="#121a34" stroke-width="12"/>
  <rect x="18" y="18" width="476" height="476" rx="22" fill="none" stroke="#1d2a58" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M256 70 L402 328 L110 328 Z" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" font-family="Arial Black, Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="188" y="212" font-size="27" transform="rotate(-60 188 212)">CALENDAR</text>
    <text x="327" y="212" font-size="27" transform="rotate(60 327 212)">NOTES</text>
    <text x="256" y="224" font-size="34">DARK</text>
    <text x="256" y="282" font-size="34">TRIAD</text>
    <text x="256" y="350" font-size="34">FLOW</text>
    <text x="256" y="378" font-size="23">TASKS</text>
  </g>
</svg>
