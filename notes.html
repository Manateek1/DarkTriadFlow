<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Triad Flow | Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="notes">
  <div class="noise"></div>
  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <header class="shell topbar">
    <a href="./index.html" class="topbar-brand">
      <img src="./logo.png" alt="" class="brand-mark">
      <span>Dark Triad Flow</span>
    </a>

    <nav class="page-nav" aria-label="Primary">
      <a href="./index.html">Home</a>
      <a href="./calendar.html">Calendar</a>
      <a href="./tasks.html">Tasks</a>
      <a href="./notes.html" class="active">Notes</a>
    </nav>
  </header>

  <main class="shell page-shell">
    <section class="hero panel page-hero">
      <div class="hero-copy">
        <p class="eyebrow">Notes</p>
        <h1>Day memory</h1>
        <p class="hero-text">
          Keep dated notes on their own page, anchored to the currently selected day and still connected to the same
          schedule and task state.
        </p>
      </div>

      <div class="hero-controls">
        <label class="control-card">
          <span>Selected day</span>
          <input id="selectedDateInput" type="date">
        </label>

        <label class="control-card">
          <span>Capacity for that day</span>
          <div class="range-row">
            <input id="minutesAvailable" type="range" min="30" max="540" step="15" value="180">
            <strong id="minutesAvailableValue">180 min</strong>
          </div>
        </label>

        <div class="control-grid">
          <label class="control-card">
            <span>Energy level</span>
            <select id="energyLevel">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>

          <label class="control-card">
            <span>Mode</span>
            <select id="planningMode">
              <option value="balanced" selected>Balanced</option>
              <option value="deadline">Deadline rescue</option>
              <option value="focus">Focus block</option>
              <option value="recovery">Recovery day</option>
            </select>
          </label>
        </div>

        <div class="hero-actions">
          <button id="todayBtn" type="button" class="secondary">Jump to Today</button>
          <button id="loadSampleBtn" type="button">Load Sample Data</button>
        </div>
      </div>
    </section>

    <section class="triad-overview" id="overviewCards"></section>

    <section class="notes-layout">
      <article class="panel triad-panel notes-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Notes</p>
            <h2>Day note</h2>
          </div>
          <p id="noteMeta" class="panel-summary"></p>
        </div>
        <textarea id="dayNoteInput" class="day-note-input" rows="16" placeholder="Write the mission, constraints, loose ideas, or things worth remembering for this date."></textarea>
      </article>

      <article class="panel triad-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Attached work</p>
            <h2 id="selectedDayHeading">Selected day</h2>
          </div>
          <p id="selectedDaySummary" class="panel-summary"></p>
        </div>
        <div id="selectedDaySchedule" class="stack-list empty-state">No tasks scheduled for this day yet.</div>
      </article>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
